<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课表集控编辑</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b;
  --fg:#e6e9ee; --dim:#8b95a3; --accent:#4a9eff; --ok:#3fb950;
  --warn:#d29922; --bad:#f85149;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:20;background:var(--panel);
       border-bottom:1px solid var(--line);padding:10px 16px;
       display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600}
.school{color:var(--dim);font-size:12px}
.spacer{flex:1}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
       border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
main{padding:16px;max-width:1500px;margin:0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 14px;border-radius:6px;background:var(--panel);
     border:1px solid var(--line);cursor:pointer;font-size:13px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab.res{opacity:.55;font-style:italic}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:14px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;
         text-transform:uppercase;letter-spacing:.5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:0;text-align:center}
th{background:var(--panel2);padding:7px 4px;font-weight:600;font-size:12px}
th.slot{width:120px;text-align:left;padding-left:10px;color:var(--dim);font-weight:400}
td select{width:100%;height:100%;min-height:32px;background:transparent;color:var(--fg);
          border:0;padding:5px 3px;font-size:13px;cursor:pointer;text-align:center;
          text-align-last:center;appearance:none}
td select:hover{background:var(--panel2)}
td select:focus{outline:2px solid var(--accent);outline-offset:-2px}
td.empty select{color:#4a5260}
tr.divider td,tr.divider th{border-bottom:2px solid var(--accent)}
.mark{background:#12161b;color:var(--warn);font-size:11px;padding:3px 10px;text-align:left}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
label.f{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12px}
input[type=text],select.inp{background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:13px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.toggle{position:relative;width:40px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#39404b;border-radius:22px;transition:.15s}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.15s}
input:checked+.slider{background:var(--accent)}
input:checked+.slider:before{transform:translateX(18px)}
.wk{display:flex;gap:5px;margin-bottom:10px}
.wk .tab{padding:5px 12px;font-size:12px}
#log{white-space:pre-wrap;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;
     background:#0a0d11;border:1px solid var(--line);border-radius:8px;
     padding:12px;max-height:340px;overflow:auto;margin-top:10px}
.toast{position:fixed;right:16px;bottom:16px;z-index:99;background:var(--panel2);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
  padding:11px 15px;max-width:420px;box-shadow:0 8px 28px #0009;font-size:13px}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.hint{color:var(--dim);font-size:12px;margin-top:8px}
.dirty{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>课表集控编辑</h1>
  <span class="school" id="school"></span>
  <span class="spacer"></span>
  <span id="dirty" class="dirty"></span>
  <button id="bSave" class="primary">保存</button>
  <button id="bBuild">构建校验</button>
  <button id="bPre">预检</button>
  <button id="bPub" class="danger">发布到线上</button>
</header>

<main>
  <div class="tabs" id="tabs"></div>

  <div class="card" id="cCls">
    <h2>班级设置</h2>
    <div class="row2">
      <label class="f">id <input type="text" id="fId" size="10" readonly title="id 对应线上目录名，改动会导致大屏拉不到课表，故只读"></label>
      <label class="f">名称 <input type="text" id="fName" size="14"></label>
      <label class="f">默认作息 <select class="inp" id="fTl"></select></label>
      <label class="f">轮换周数 <input type="text" id="fWeeks" size="3"></label>
    </div>
    <div class="hint">id 只读：它就是线上目录名，也是客户端 <code>{id}</code> 的替换值，改了大屏立刻拉不到课表。</div>
  </div>

  <div class="card">
    <h2>课表</h2>
    <div class="wk" id="wkTabs"></div>
    <div style="overflow:auto"><table id="grid"></table></div>
    <div class="hint">行 = 上课节次（左侧为该节真实起止时间）；蓝线 = 作息里的分割线；留空 = 无课。周五等使用不同作息的日子会单独按其作息渲染。</div>
  </div>

  <div class="card">
    <h2>集控策略（policy）</h2>
    <div class="grid" id="pol"></div>
  </div>

  <div class="card">
    <h2>输出</h2>
    <div id="log">就绪。</div>
  </div>
</main>

<script>
let ST=null, cur=0, curWeek=1, dirty=false;
const $=s=>document.querySelector(s);

function toast(msg,kind){
  const d=document.createElement('div');
  d.className='toast '+(kind||'');
  d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), kind==='bad'?9000:4200);
}
function log(t){ $('#log').textContent=t; }
function setDirty(v){ dirty=v; $('#dirty').textContent=v?'● 未保存':''; }

async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',
    headers:{'Content-Type':'application/json'},
    body:body?JSON.stringify(body):null});
  const j=await r.json().catch(()=>({error:'响应不是 JSON'}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}

// ── 星期键解析：mon / mon@1 ────────────────────────────────
function parseDay(k){
  const m=String(k).match(/^([a-z]+)(?:@(\d+))?$/);
  return m?{day:m[1],div:m[2]?+m[2]:0}:null;
}
function dayKey(day,div){ return div?`${day}@${div}`:day; }

// 取某天的课程数组与所用作息（dict 形式可覆盖作息）
function getDay(cls,key){
  const s=cls.schedule[key];
  if(s==null) return null;
  if(Array.isArray(s)) return {tl:cls.timelayout, list:s, dict:false};
  return {tl:s.timelayout||cls.timelayout, list:s.classes||[], dict:true};
}
function setDay(cls,key,list,tl,dict){
  if(dict) cls.schedule[key]={timelayout:tl, classes:list};
  else cls.schedule[key]=list;
}

function renderTabs(){
  const t=$('#tabs'); t.innerHTML='';
  ST.classes.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='tab'+(i===cur?' on':'')+(c.reserved?' res':'');
    d.textContent=c.name+(c.reserved?'（预留）':'');
    d.onclick=()=>{cur=i;render()};
    t.appendChild(d);
  });
}

function renderWeekTabs(cls){
  // 这个班用到的轮换周序号集合
  const divs=new Set();
  Object.keys(cls.schedule).forEach(k=>{
    const p=parseDay(k); if(p) divs.add(p.div);
  });
  const w=$('#wkTabs'); w.innerHTML='';
  const list=[...divs].sort();
  if(list.length===1&&list[0]===0){ return; }   // 无轮换，不显示切换
  list.filter(d=>d>0).forEach(d=>{
    const b=document.createElement('div');
    b.className='tab'+(d===curWeek?' on':'');
    b.textContent='第'+d+'周';
    b.onclick=()=>{curWeek=d;render()};
    w.appendChild(b);
  });
  if(divs.has(0)){
    const b=document.createElement('div');
    b.className='tab'+(curWeek===0?' on':'');
    b.textContent='每周相同';
    b.onclick=()=>{curWeek=0;render()};
    w.appendChild(b);
  }
}

function render(){
  const cls=ST.classes[cur];
  $('#school').textContent=ST.school+' · '+ST.base_url;
  renderTabs();

  $('#fId').value=cls.id;
  $('#fName').value=cls.name;
  $('#fWeeks').value=cls.weeks;
  const sel=$('#fTl'); sel.innerHTML='';
  Object.keys(ST.timelayouts).forEach(n=>{
    const o=document.createElement('option'); o.value=n; o.textContent=n;
    if(n===cls.timelayout) o.selected=true; sel.appendChild(o);
  });

  renderWeekTabs(cls);
  renderGrid(cls);
  renderPolicy();
}

function renderGrid(cls){
  const tb=$('#grid'); tb.innerHTML='';
  if(cls.reserved){
    tb.innerHTML='<tr><td style="padding:20px;color:var(--dim)">'+
      '预留班级：已占住 id、尚未排课。<br>要开始排课，请在下方选好默认作息后点「转为正式班级」。'+
      '</td></tr>';
    if(!$('#bAct')){
      const b=document.createElement('button'); b.id='bAct'; b.className='primary';
      b.textContent='转为正式班级'; b.style.marginTop='10px';
      b.onclick=()=>{
        cls.reserved=false; cls.timelayout=cls.timelayout||Object.keys(ST.timelayouts)[0];
        cls.schedule={}; setDirty(true); render();
      };
      $('#cCls').appendChild(b);
    }
    return;
  }
  const ab=$('#bAct'); if(ab) ab.remove();

  // 本周视图下每天用哪个 key
  const cols=[];
  ST.dayOrder.forEach(d=>{
    // 优先精确匹配当前周，其次无轮换键
    let key=null;
    if(cls.schedule[dayKey(d,curWeek)]!=null) key=dayKey(d,curWeek);
    else if(cls.schedule[d]!=null) key=d;
    if(key) cols.push({day:d,key});
  });
  if(!cols.length){
    tb.innerHTML='<tr><td style="padding:18px;color:var(--dim)">本周暂无排课。</td></tr>';
    return;
  }

  // 以班级默认作息的槽位为主轴；某天作息不同则单独取其槽位
  const mainTl=ST.timelayouts[cls.timelayout]||{slots:[],marks:[]};
  const maxRows=Math.max(mainTl.slots.length,
    ...cols.map(c=>(ST.timelayouts[getDay(cls,c.key).tl]||{slots:[]}).slots.length));

  const thead=document.createElement('tr');
  thead.innerHTML='<th class="slot">节次 / 时间</th>'+
    cols.map(c=>{
      const g=getDay(cls,c.key);
      const diff=g.tl!==cls.timelayout?`<br><span style="color:var(--warn);font-weight:400;font-size:11px">${g.tl}</span>`:'';
      return `<th>${ST.dayLabel[c.day]}${diff}</th>`;
    }).join('');
  tb.appendChild(thead);

  for(let r=0;r<maxRows;r++){
    // 分割线标记（按主作息）
    const mk=mainTl.marks.filter(m=>m.after===r);
    mk.forEach(m=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td class="mark" colspan="${cols.length+1}">${
        m.kind==='divider'?'──── 分割线 ────':'· '+m.name}</td>`;
      tb.appendChild(tr);
    });

    const tr=document.createElement('tr');
    const s=mainTl.slots[r];
    tr.innerHTML=`<th class="slot">${r+1}　${s?s.start+'-'+s.end:''}</th>`;
    cols.forEach(c=>{
      const g=getDay(cls,c.key);
      const td=document.createElement('td');
      if(r>=(ST.timelayouts[g.tl]||{slots:[]}).slots.length){
        td.style.background='#12161b'; tr.appendChild(td); return;
      }
      const v=g.list[r]||'';
      if(!v) td.className='empty';
      const sl=document.createElement('select');
      sl.innerHTML='<option value="">—</option>'+
        ST.subjects.map(n=>`<option${n===v?' selected':''}>${n}</option>`).join('');
      sl.onchange=()=>{
        g.list[r]=sl.value;
        setDay(cls,c.key,g.list,g.tl,g.dict);
        td.className=sl.value?'':'empty';
        setDirty(true);
      };
      td.appendChild(sl); tr.appendChild(td);
    });
    tb.appendChild(tr);
  }
}

function renderPolicy(){
  const g=$('#pol'); g.innerHTML='';
  ST.policyOrder.forEach(k=>{
    const d=document.createElement('div'); d.className='sw';
    d.innerHTML=`<span>${ST.policyLabel[k]||k}<br>
      <span style="color:var(--dim);font-size:11px">${k}</span></span>
      <label class="toggle"><input type="checkbox"${ST.policy[k]?' checked':''}>
      <span class="slider"></span></label>`;
    d.querySelector('input').onchange=e=>{ST.policy[k]=e.target.checked;setDirty(true)};
    g.appendChild(d);
  });
}

// ── 动作 ───────────────────────────────────────────────────
function payload(){
  // 回传时把 id 还原成字符串，name/weeks 取界面值
  const cls=ST.classes[cur];
  cls.name=$('#fName').value.trim();
  cls.timelayout=$('#fTl').value;
  cls.weeks=parseInt($('#fWeeks').value)||2;
  return {policy:ST.policy, classes:ST.classes};
}
function busy(b){ ['#bSave','#bBuild','#bPre','#bPub'].forEach(s=>$(s).disabled=b); }

$('#bSave').onclick=async()=>{
  busy(true);
  try{
    const r=await api('/api/save',payload());
    setDirty(false);
    let m='已保存（备份 '+r.backup+'）';
    if(r.warnings&&r.warnings.length){ m+='\n⚠ '+r.warnings.join('\n⚠ '); toast(m,'warn'); }
    else toast(m,'ok');
    log(m);
  }catch(e){ toast('保存失败：'+e.message,'bad'); log('✗ '+e.message); }
  finally{ busy(false); }
};

$('#bBuild').onclick=async()=>{
  busy(true); log('构建中…');
  try{ const r=await api('/api/build',{});
    log(r.out||'(无输出)');
    toast(r.rc===0?'构建通过':'构建失败', r.rc===0?'ok':'bad');
  }catch(e){ toast(e.message,'bad'); log('✗ '+e.message); }
  finally{ busy(false); }
};

$('#bPre').onclick=async()=>{
  busy(true); log('预检中…');
  try{ const r=await api('/api/preflight',{});
    log(r.steps.map(s=>'$ '+s.cmd+'\n'+s.out).join('\n'));
    toast(r.rc===0?'预检通过，可以发布':'预检未通过，已阻止发布', r.rc===0?'ok':'bad');
  }catch(e){ toast(e.message,'bad'); log('✗ '+e.message); }
  finally{ busy(false); }
};

$('#bPub').onclick=async()=>{
  if(dirty&&!confirm('有未保存的改动，发布用的是已保存内容。继续？')) return;
  const msg=prompt('提交说明（可留空）','由流水线生成：课表更新');
  if(msg===null) return;
  if(!confirm('将覆盖线上文件并 push 到 Gitee。\n（覆盖前自动备份到 NAS，预检不通过会中止）\n确定？')) return;
  busy(true); log('发布中…');
  try{ const r=await api('/api/publish',{message:msg});
    log(r.steps.map(s=>'$ '+s.cmd+'  → rc='+s.rc+'\n'+s.out).join('\n'));
    if(r.rc===0&&r.stage==='push') toast('已发布并推送到线上','ok');
    else if(r.stage==='nochange') toast('线上内容无变化，无需发布','warn');
    else if(r.stage==='preflight') toast('预检未通过，已中止发布（线上未改动）','bad');
    else toast('发布失败（阶段：'+r.stage+'）','bad');
  }catch(e){ toast(e.message,'bad'); log('✗ '+e.message); }
  finally{ busy(false); }
};

$('#fName').oninput=()=>setDirty(true);
$('#fWeeks').oninput=()=>setDirty(true);
$('#fTl').onchange=()=>{setDirty(true);ST.classes[cur].timelayout=$('#fTl').value;render()};

window.onbeforeunload=()=>dirty?'有未保存的改动':null;

(async()=>{
  try{ ST=await api('/api/state'); render(); log('已载入 '+ST.file); }
  catch(e){ log('✗ 载入失败：'+e.message); toast(e.message,'bad'); }
})();
</script>
</body>
</html>
